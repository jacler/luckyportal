name = "luckyportal"
main = "./worker/index.ts"
compatibility_date = "2026-08-09"

# Git / Dashboard 部署设置：
#   Build command:  npm run build
#   Deploy command: npx wrangler deploy
# Worker 名称必须是 luckyportal

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
# 仅 API 走 Worker；其余直接静态资源
run_worker_first = ["/portal-api", "/portal-api/*"]
