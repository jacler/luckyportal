name = "luckyportal"
main = "./worker/index.ts"
compatibility_date = "2026-08-09"

# 注意：Dashboard 里的 Worker 名称必须也是 luckyportal（与 name 一致）

[assets]
not_found_handling = "single-page-application"
binding = "ASSETS"
run_worker_first = ["/portal-api", "/portal-api/*"]

# Bindings（Dashboard → Settings）：
#   KV Namespace → CONTENT
# Variables：
#   ADMIN_PASSWORD / TOKEN_SECRET
#
# Git 构建设置：
#   Build command:  npm run build
#   Deploy command: npx wrangler deploy
