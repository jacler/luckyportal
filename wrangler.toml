# Cloudflare Workers（部署命令必填时用这个方案）
name = "luckyportal"
main = "./worker/index.ts"
compatibility_date = "2026-08-09"

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/portal-api", "/portal-api/*"]

# Dashboard（Workers + Connect to Git）：
#   Root directory:   留空
#   Build command:    npm run build
#   Deploy command:   npx wrangler deploy
# Worker 名称必须是：luckyportal
