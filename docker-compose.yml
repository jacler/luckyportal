services:
  api:
    build: ./server
    container_name: luckyportal-api
    restart: unless-stopped
    environment:
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-LuckyAdmin2026}
      TOKEN_SECRET: ${TOKEN_SECRET:-LuckyPortalToken2026}
      DATA_DIR: /data
      PORT: 8787
    volumes:
      - luckyportal_data:/data
    ports:
      - "8787:8787"
    networks:
      - luckyportal
      - soulmemory_soulmemory

volumes:
  luckyportal_data:

networks:
  luckyportal:
  soulmemory_soulmemory:
    external: true
